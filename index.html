<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vikas Kumar Paswan | Projects</title>

<style>

/* GLOBAL */
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #020617, #0f172a);
    color: #e2e8f0;
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    z-index: 9999;

    padding: 16px 40px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    /* PREMIUM GLASS EFFECT */
    background: rgba(2, 6, 23, 0.85);
    backdrop-filter: blur(14px);

    /* VISUAL SEPARATION */
    border-bottom: 1px solid rgba(255,255,255,0.08);
    
    /* SHADOW FOR DEPTH */
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}

h1 { margin: 0; font-size: 20px; }

/* HEADER RIGHT CONTAINER */
.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.studio-link {
    display: inline-flex;
    align-items: center;
    padding: 8px 14px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    color: #082016;
    background: linear-gradient(135deg, #5eead4, #38bdf8);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 15px rgba(0,0,0,0.35);
    white-space: nowrap;
}
.studio-link:hover {
    transform: translateY(-2px);
}

/* ICON BUTTON BASE */
.icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(135deg, #1e293b, #334155);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    overflow: hidden;
    transition: all 0.3s ease;
}

/* IMAGE INSIDE BUTTON */
.icon-btn img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
}

/* LINKEDIN SPECIAL COLOR */
.icon-btn.linkedin {
    background: linear-gradient(135deg, #0077b5, #00a0dc);
}

/* HOVER EFFECT */
.icon-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
}

/* GLOWING SEPARATOR */
.separator {
    width: 2px;
    height: 28px;

    background: linear-gradient(
        to bottom,
        transparent,
        #38bdf8,
        transparent
    );

    opacity: 0.8;

    /* Glow */
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
}
    
/* CONTAINER */
.container {
    padding: 30px 40px;
}

/* FILTERS */
.filters {
    margin-bottom: 25px;
}

input, select {
    padding: 10px;
    border-radius: 10px;
    border: none;
    margin-right: 10px;
    background: rgba(30, 41, 59, 0.6);
    color: white;
    backdrop-filter: blur(8px);
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
}

@media (max-width: 1024px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
}

/* CARD (GLASS EFFECT) */
.card {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255,255,255,0.05);
    transition: all 0.4s ease;
}

.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

/* IMAGE */
.card img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    transition: 0.4s;
}

.card:hover img {
    transform: scale(1.05);
}

/* BODY */
.card-body {
    padding: 16px;
    flex-grow: 1;
}

.card-body h3 {
    margin: 0 0 8px;
    font-size: 18px;
}

.card-body p {
    font-size: 14px;
    color: #94a3b8;
}

.card-body small {
    color: #38bdf8;
    font-size: 12px;
}

/* FOOTER */
.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 18px;
    gap: 10px;
}

/* BUTTON BASE */
.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 999px;
    text-decoration: none;
    transition: all 0.3s ease;
    cursor: pointer;
    white-space: nowrap;
}

/* DASHBOARD BUTTON */
.btn-primary {
    background: linear-gradient(135deg, #4facfe, #00c6ff);
    color: white;
    box-shadow: 0 4px 15px rgba(0, 198, 255, 0.35);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 198, 255, 0.6);
}

/* PBIX BUTTON */
.btn-secondary {
    background: linear-gradient(135deg, #ff7e5f, #ff512f);
    color: white;
    box-shadow: 0 4px 15px rgba(255, 94, 0, 0.35);
}

.btn-secondary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255, 94, 0, 0.6);
}

/* MORE DETAILS BUTTON */
.btn-outline {
    background: transparent;
    color: #38bdf8;
    border: 2px solid rgba(56, 189, 248, 0.6);
}

.btn-outline:hover {
    background: rgba(56, 189, 248, 0.1);
    transform: translateY(-1px);
}

/* RIGHT BUTTON GROUP */
.right-buttons {
    display: flex;
    gap: 8px;
}

/* MODAL OVERLAY */
.modal {
    display: none;
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);

    z-index: 99999;

    overflow-y: auto;      /* ENABLE VERTICAL SCROLL */
    padding: 40px 20px;    /* BREATHING SPACE */
    box-sizing: border-box;
}

/* MODAL BOX */
.modal-content {
    position: relative;

    background: linear-gradient(135deg, #111c2d, #0f1b31);

    width: min(1400px, 92%);
    margin: 40px auto;

    padding: 40px;

    border-radius: 20px;

    border: 1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 20px 80px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.03);

    animation: modalFade 0.3s ease;
}

/* MODAL ANIMATION */
@keyframes modalFade {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* CLOSE BUTTON */
.close {
    position: absolute;
    top: 20px;
    right: 24px;

    cursor: pointer;

    font-size: 32px;
    font-weight: 300;

    color: #e2e8f0;

    transition: 0.3s ease;
}

.close:hover {
    transform: rotate(90deg);
    color: #38bdf8;
}

/* MODAL TYPOGRAPHY */
.modal-content h2 {
    margin-top: 0;
    margin-bottom: 16px;

    font-size: 42px;
    font-weight: 700;

    color: white;
}

.modal-content h3 {
    margin-top: 32px;
    margin-bottom: 12px;

    color: #38bdf8;
    font-size: 26px;
}

.modal-content p,
.modal-content li {
    color: #dbe4f0;
    line-height: 1.8;
    font-size: 17px;
}

.modal-content ul {
    padding-left: 24px;
}

.modal-content hr {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.12);
    margin: 20px 0 30px;
}

</style>
</head>

<body>

<header>
    <h1>Vikas Kumar Paswan | Projects</h1>
<div class="header-right">

    <a href="studio/index.html" class="studio-link">Delivery Studio</a>

    <!-- LinkedIn Icon -->
    <a href="https://www.linkedin.com/in/vikaskumar1802/" target="_blank" class="icon-btn linkedin">

</header>

<div class="container">

<div class="filters">
    <input type="text" id="search" placeholder="Search projects...">
    <select id="domainFilter">
        <option value="">All Domains</option>
        <option value="Performance Analysis">Performance Analysis</option>
        <option value="Finance">Finance</option>
    </select>
</div>

<div class="grid" id="projectGrid"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">✖</span>

</div>
</div>

<script>

const projects = [
{ 
        title: "Annotation Operations Analytics", 
        domain: "Performance Analysis", 
        tools: "Power BI, Excel", 
        image: "images/project 1.png",
        live: "https://app.powerbi.com/view?r=eyJrIjoiY2MxOWNkYmUtYzZkMC00NjU5LWFiZjctNDQ5YjJlODk1ZDk4IiwidCI6ImRkNWMyODc4LWQ4MTMtNGY5My05NmNjLTU1ZmZjOGY1ZmQ1MiJ9&pageName=05ea9ac4472c8e006bd0", 
        download: "files/Annotation Operations Analytics.pbix",
        short: "Improved operational visibility through centralized KPI tracking and workforce performance analytics.",
        details: `
        <h2>Annotation Operations Analytics</h2>
        <hr>
        
        <h3><u>Business Problem</u></h3>
        <p>Operations leadership lacked centralized visibility into resource utilization, productivity performance, and annotation quality metrics across projects and teams. 
        Manual tracking through spreadsheets made it difficult to identify operational bottlenecks, monitor workforce efficiency, and take timely decisions.</p>
        
        <h3><u>Objective</u></h3>

        <h3><u>Data Model</u></h3>

        <ul>
            <li>FactProductivity</li>

            <li>Date Table</li>
            <li>Dimension tables for Users and Projects</li>
        </ul>
        
        <h3><u>DAX</u></h3>

         <ul>
            <li>Utilization %</li>
            <li>Productivity Score</li>
            <li>Rework Rate %</li>

            <li>Planned vs Capacity Hours</li>
            <li>Tasks per User</li>

        <h3><u>Insights</u></h3>

            <li>Enabled visibility into team-wise workload balancing and capacity planning</li>

        </ul>
        
        <h3><u>Impact</u></h3>

} 
/*{ 
        title: "Financial KPI Dashboard", 
        domain: "Finance", 
        tools: "Power BI, Excel", 
        image: "images/riswan-ratta-mlnAX_7Cuv0-unsplash.png", 
        live: "https://app.powerbi.com/view?r=eyJrIjoiZTI0NDY1NjYtMzc2ZC00YWM1LWIwMTMtMjhiMTM3ODA4MDk4IiwidCI6ImRkNWMyODc4LWQ4MTMtNGY5My05NmNjLTU1ZmZjOGY1ZmQ1MiJ9", 
        download: "assets/files/sales-dashboard.pbix", 
        short: "Tracked financial health and cost optimization metrics.", 
        details: "<h2>Finance Project Details Coming Soon</h2>" 
} */   
];

function renderProjects() {
    const grid = document.getElementById("projectGrid");
    const search = document.getElementById("search").value.toLowerCase();
    const domain = document.getElementById("domainFilter").value;

    grid.innerHTML = "";

    projects
    .filter(p =>
        p.title.toLowerCase().includes(search) &&
        (domain === "" || p.domain === domain)
    )
    .forEach(p => {
        grid.innerHTML += `
        <div class="card">
            <img src="${p.image}">
            
            <div class="card-body">
                <h3>${p.title}</h3>
                <p>${p.short}</p>
                <small>${p.tools}</small>
            </div>

            <div class="card-footer">

                <button class="btn btn-outline" onclick="openModal('${p.title}')">
                    More Details
                </button>

                <div class="right-buttons">
                    <a href="${p.live}" target="_blank" class="btn btn-primary">
                        Dashboard
                    </a>
                    <a href="${p.download}" download class="btn btn-secondary">
                        PBIX File
                    </a>
                </div>

            </div>
        </div>
        `;
    });
}

function openModal(title) {
    const project = projects.find(p => p.title === title);

    document.getElementById("projectDetails").innerHTML = project.details;

    document.getElementById("modal").style.display = "block";

    document.body.style.overflow = "hidden";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";

    document.body.style.overflow = "auto";
}

document.getElementById("search").addEventListener("input", renderProjects);
document.getElementById("domainFilter").addEventListener("change", renderProjects);

renderProjects();

</script>

</body>
</html>
